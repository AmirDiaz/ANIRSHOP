<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - AMIRSHOP</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9f9;
    }
    header {
      background: #111;
      color: white;
      padding: 15px;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 0 10px;
      text-decoration: none;
    }
    nav a.active {
      font-weight: bold;
      border-bottom: 2px solid #fff;
    }
    main {
      max-width: 600px;
      margin: 40px auto;
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    main h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #444;
    }
    footer {
      text-align: center;
      padding: 15px;
      margin-top: 40px;
      background: #111;
      color: white;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <h1>AMIRSHOP</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <!-- Contact Section -->
  <main>
    <h2>Contact Us</h2>
    <p style="text-align:center; color:#555;">Fill your details then click the button to send us an email.</p>

    <label for="name">Your Name</label>
    <input type="text" id="name" placeholder="Type your name">

    <label for="email">Your Email</label>
    <input type="email" id="email" placeholder="Type your email">

    <label for="message">Message</label>
    <textarea id="message" rows="5" placeholder="Type your message"></textarea>

    <button onclick="sendMail()">Send via Gmail</button>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 AMIRSHOP. All rights reserved.</p>
  </footer>

  <script>
    function sendMail() {
      let name = document.getElementById("name").value;
      let email = document.getElementById("email").value;
      let message = document.getElementById("message").value;

      let subject = encodeURIComponent("New message from " + name);
      let body = encodeURIComponent("Name: " + name + "\nEmail: " + email + "\nMessage: " + message);

      // فتح Gmail مباشرة
      window.open("https://mail.google.com/mail/?view=cm&fs=1&to=amirsaoudi620@gmail.com&su=" + subject + "&body=" + body);
    }
  </script>
</body>
</html>
